name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Browser playthrough
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build art atlas
        run: npm run art:build

      - name: Run visual playthrough
        run: npm run playtest:visual

      - name: Upload playtest report (screenshots of every beat)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playtest-report
          path: |
            playtest-report/
            playwright-report/
          retention-days: 14
