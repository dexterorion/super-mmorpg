name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit + content tests (with coverage)
        run: npm run test:coverage

      - name: Build art atlas
        run: npm run art:build

      - name: Headless playtest (softlock / completability / economy)
        run: npm run playtest -- --runs 500

      - name: Life-year playtest (daily / monthly idempotency)
        run: npm run playtest:life

      - name: Build
        run: npx vite build

      - name: Check bundle budget
        run: node tools/ci/check-bundle-size.mjs

      - name: Upload coverage
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Upload life-year report
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: life-year-report
          path: playtest-report/life-year.json
          retention-days: 14

      - name: Upload dist
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
